[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-harness"
version = "5.1.1-dev"
description = "Claude Code plugin that enables autonomous AI development while maintaining best practices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "jinja2>=3.1",
    "pyjwt[crypto]>=2.8",
    "pyright>=1.1.408",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
maverick = "maverick.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"maverick.cloud_init" = ["**/*.yaml"]
# Skill/agent sources, so an installed CLI can render runtime bundles itself
# (`maverick kiro install`). They are templates + config.py files loaded by
# path, not importable packages.
maverick = [
    "skills/*/config.py",
    "skills/*/body.md.j2",
    "skills/*/*.yml",
    "agents/*/config.py",
    "agents/*/body.md.j2",
    "docs-skills/body.md.j2",
]

[tool.uv.workspace]
members = [
    "prototyping/my-python-app",
]
