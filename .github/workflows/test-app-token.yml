name: Test App Token (transient)

# Validates that the Maverick GitHub App token can update `stable`
# (i.e. is in the `Protect Stable` ruleset bypass list). Performs an
# idempotent PATCH that sets `stable` to its current SHA — no actual
# change, but the request still goes through ruleset enforcement,
# making this a faithful dry-run of the release-finalize stable step.
#
# Manually triggered via `workflow_dispatch`. Delete this file once
# the App token path is verified end-to-end on a real release.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/release-finalize-app-token

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.MAVERICK_APP_ID }}
          private-key: ${{ secrets.MAVERICK_APP_PRIVATE_KEY }}

      - name: Confirm token authenticates as the Maverick App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== /installation/repositories ==="
          gh api /installation/repositories \
            --jq '{app: .repositories[0].owner.login, repos: [.repositories[].full_name]}'

      - name: Idempotent PATCH on stable (exercises ruleset bypass)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          STABLE_SHA=$(gh api "repos/${REPO}/git/refs/heads/stable" --jq .object.sha)
          echo "Current stable SHA: ${STABLE_SHA}"
          echo "Attempting idempotent PATCH (same SHA)..."

          gh api -X PATCH \
            "repos/${REPO}/git/refs/heads/stable" \
            -f sha="${STABLE_SHA}"

          echo "PATCH succeeded — App token is accepted by the Protect Stable ruleset."
